services:
  louann-bande:
    build: .
    image: louann-bande
    container_name: louann-bande
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3060}:8000"
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/bande.db
      - DISCORD_INVITE=${DISCORD_INVITE:-}
    mem_limit: 128m
    cpus: 0.5
